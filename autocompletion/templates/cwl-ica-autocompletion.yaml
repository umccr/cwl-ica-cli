---
name: cwl-ica

subcommands:
  help:
    summary: |
      Print help and exit

  version:
    summary: |
      Print version and exit


  ######################
  # Configuration Commands
  ######################
  configure-repo:
    summary: |
      One-time command to point to the cwl-ica git repository
    options:
      - name: repo-path
        type: dir
        summary: |
          path to local cwl-ica repository
  configure-user:
    summary: |
      Add a user to user.yaml
    options:
      - name: username
        type: string
        summary: |
          The name of the user
      - name: email
        type: string
        summary: |
          The users email address
      - name: identifier
        type: string
        summary: |
          The orcid ID of the user
      - name: set-as-default
        summary: |
          Set as default user


  ##########################
  # ICA Initialisers
  ##########################
  category-init:
    summary: |
      Initialise a category in ${CWL_ICA_REPO_PATH}/config/category.yaml
    options:
      - name: category-name
        summary: |
          Name of category
        type: string
      - name: category-description
        summary: |
          Category description
        type: string


  ########################
  # Set Defaults Commands
  ########################
  set-default-user:
    summary: |
      Set a user to the default user
    options:
      - name: username
        summary: |
          Name of user
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_user_names.py
            EOF

  #########################
  # List Commands
  #########################
  list-categories:
    summary: |
      List registered categories
  list-users:
    summary: |
      List registered users


  #######################
  # Creation Commands
  #######################
  create-expression-from-template:
    summary: |
      Initialise an CWL expression from the cwl expression template
    options:
      - name: expression-name
        summary: |
          The name of the expression
        type: string
      - name: expression-version
        summary: |
          Version of the expression
        type: string
      - name: username
        summary: |
          CWL Creator
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_user_names.py
            EOF
  create-schema-from-template:
    summary: |
      Initialise a CWL schema from the cwl schema template
    options:
      - name: schema-name
        summary: |
          The name of the schema
        type: string
      - name: schema-version
        summary: |
          Version of the schema
        type: string
  create-tool-from-template:
    summary: |
      Initialise a CWL tool from the cwl tool template
    options:
      - name: tool-name
        summary: |
          The name of the tool
        type: string
      - name: tool-version
        summary: |
          Version of the tool
        type: string
      - name: username
        summary: |
          CWL Creator
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_user_names.py
            EOF
  create-workflow-from-template:
    summary: |
      Initialise a CWL workflow from the cwl workflow template
    options:
      - name: workflow-name
        summary: |
          The name of the workflow
        type: string
      - name: workflow-version
        summary: |
          Version of the workflow
        type: string
      - name: username
        summary: |
          CWL Creator
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_user_names.py
            EOF


  ###################
  # Validation Commands
  ###################
  expression-validate:
    summary: |
      Validate a CWL expression
    options:
      - name: expression-path
        summary: |
          Path to the expression
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_all_expression_paths.py
            EOF
  schema-validate:
    summary: |
      Validate a CWL schema
    options:
      - name: schema-path
        summary: |
          Path to the schema
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_all_schema_paths.py
            EOF
  tool-validate:
    summary: |
      Validate a CWL tool ready for initialising on ICA
    options:
      - name: tool-path
        summary: |
          Path to the tool
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_all_tool_paths.py
            EOF
  workflow-validate:
    summary: |
      Validate a CWL workflow ready for initialising on ICA
    options:
      - name: workflow-path
        summary: |
          Path to the workflow
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_all_workflow_paths.py
            EOF
  validate-config-yamls:
    summary: |
      Confirm all config yamls are legitimate

  ###############
  # Init Commands
  ###############
  expression-init:
    summary: |
      Register an expression in ${CWL_ICA_REPO_PATH}/config/expression.yaml
    options:
      - name: expression-path
        summary: |
          Path to the expression
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_unregistered_expression_paths.py
            EOF
  schema-init:
    summary: |
      Register a schema in ${CWL_ICA_REPO_PATH}/config/schema.yaml
    options:
      - name: schema-path
        summary: |
          Path to the schema
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_unregistered_schema_paths.py
            EOF
  tool-init:
    summary: |
      Register a tool in ${CWL_ICA_REPO_PATH}/config/tool.yaml
    options:
      - name: tool-path
        summary: |
          Path to the tool
        type: string
        completion:
          command_string: |-
            python - <<EOF
            __cwl-ica_list_unregistered_tool_paths.py
            EOF
      - name: categories
        summary: |
          List of categories to add to tool
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_category_names.py
            EOF
  workflow-init:
    summary: |
      Register a workflow in ${CWL_ICA_REPO_PATH}/config/workflow.yaml
    options:
      - name: workflow-path
        summary: |
          Path to the workflow
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_unregistered_workflow_paths.py
            EOF
      - name: categories
        summary: |
          List of categories to add to tool
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_category_names.py
            EOF

  ########################
  # Add-category Commands
  ########################
  add-category-to-tool:
    summary: |
      Add an existing category to an existing tool
    options:
      - name: tool-name
        summary: |
          Name of the tool
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_tool_names.py
            EOF

      - name: category-name
        summary: |
          The name of the category
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_category_names.py
            EOF
  add-category-to-workflow:
    summary: |
      Add an existing category to an existing workflow
    options:
      - name: workflow-name
        summary: |
          Name of the workflow
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_workflow_names.py
            EOF
      - name: category-name
        summary: |
          The name of the category
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_category_names.py
            EOF

  #########################
  # Add maintainer commands
  #########################
  add-maintainer-to-expression:
    summary: |
      Add a maintainter to a cwl expression
    options:
      - name: expression-path
        summary: |
          Path to cwl expression
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_all_expression_paths.py
            EOF

      - name: username
        summary: |
          Name of maintainer
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_user_names.py
            EOF
  add-maintainer-to-tool:
    summary: |
      Add a maintainter to a cwl tool
    options:
      - name: tool-path
        summary: |
          Path to cwl tool
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_all_tool_paths.py
            EOF
      - name: username
        summary: |
          Name of maintainer
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_user_names.py
            EOF

  add-maintainer-to-workflow:
    summary: |
      Add a maintainter to a cwl workflow
    options:
      - name: workflow-path
        summary: |
          Path to cwl workflow
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_all_workflow_paths.py
            EOF
      - name: username
        summary: |
          Name of project
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_user_names.py
            EOF

  #######################
  # Query workflow Commands
  #######################
  get-workflow-step-ids:
    summary: |
      Get the step ids of a CWL workflow
    options:
      - name: workflow-path
        summary: |
          A cwl workflow file
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_all_workflow_paths.py
            EOF


  #######################
  # Typescript Extensions Commands
  #######################
  create-typescript-expression-from-template:
    summary: |
      Initialise an typescript expression from the typescript expression template
    options:
      - name: typescript-expression-name
        summary: |
          The name of the typescript-expression
        type: string
      - name: typescript-expression-version
        summary: |
          Version of the typescript expression
        type: string
      - name: username
        summary: |
          CWL Creator
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_user_names.py
            EOF
  append-typescript-directory-to-cwl-expression-tool:
    summary: |
      Append a directory named 'typescript-expressions' to a CWL expression tool
    options:
      - name: expression-path
        summary: |
          The path to the cwl expression tool
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_all_expression_paths.py
            EOF
      - name: xtrace
        summary: |
          Set xtrace on the initialise_typescript_expression_directory script
  append-typescript-directory-to-cwl-commandline-tool:
    summary: |
      Append a directory named 'typescript-expressions' to a CWL commandline tool
    options:
      - name: tool-path
        summary: |
          The path to the cwl commandline tool
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_all_tool_paths.py
            EOF
      - name: xtrace
        summary: |
          Set xtrace on the initialise_typescript_expression_directory shell script
  append-typescript-directory-to-cwl-workflow:
    summary: |
      Append a directory named 'typescript-expressions' to a cwl workflow
    options:
      - name: workflow-path
        summary: |
          The path to the cwl workflow
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_all_workflow_paths.py
            EOF
      - name: xtrace
        summary: |
          Set xtrace on the initialise_typescript_expression_directory shell script
  create-typescript-interface-from-cwl-schema:
    summary: |
      Given a cwl schema create a typescript interface in the same directory
    options:
      - name: schema-path
        summary: |
          The name of the tool
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_all_schema_paths.py
            EOF
  typescript-expression-validate:
    summary: |
      Validate a typescript expression and generate a .cwljs file ready for importation
    options:
      - name: typescript-expression-dir
        summary: |
          The name of the workflow
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_all_typescript_expression_paths.py
            EOF
      - name: xtrace
        summary: |
          Set xtrace on the validate_typescript_expressions_directory shell script
  typescript-expression-update:
    summary: |
      Update a typescript expression yarn.lock file
    options:
      - name: typescript-expression-dir
        summary: |
          The name of the workflow
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_all_typescript_expression_paths.py
            EOF
      - name: xtrace
        summary: |
          Set xtrace on the update_yarn_dependencies shell script
  icav2-zip-workflow:
    summary: |
      Zip up a workflow ready to become a pipeline in ICAv2
    options:
      - name: workflow-path
        summary: |
          The path to the cwl workflow
        type: string
        completion:
          command_string: |
            python - <<EOF
            __cwl-ica_list_all_workflow_paths.py
            EOF
      - name: output-path
        summary: Optional, set the output path, otherwise just the working directory
        type: string
      - name: force
        summary: Optional, override existing zip file if one already exists
  icav2-deploy-pipeline:
    summary: |
      Deploy a zipped workflow to ICAv2
    options:
      - name: zipped-workflow-path
        summary: |
          Required, path to zipped up workflow
        type: string
      - name: project-id
        summary: |
          Optional, provide the project id (takes precedence over project-name)
        type: string
        completion:
          command_string: |-
            if [[ -n "${ICAV2_ACCESS_TOKEN-}" ]]; then
              curl --silent --fail --location --request "GET" \
                   --url "https://${ICAV2_BASE_URL-ica.illumina.com}/ica/rest/api/projects" \
                   --header 'Accept: application/vnd.illumina.v3+json' \
                   --header "Authorization: Bearer ${ICAV2_ACCESS_TOKEN}" | \
              jq --raw-output '.items[] | .id'
            fi
      - name: project-name
        summary: |
          Optional, provide the project name
        type: string
        completion:
          command_string: |-
            if [[ -n "${ICAV2_ACCESS_TOKEN-}" ]]; then
              curl --silent --fail --location --request "GET" \
                   --url "https://${ICAV2_BASE_URL-ica.illumina.com}/ica/rest/api/projects" \
                   --header 'Accept: application/vnd.illumina.v3+json' \
                   --header "Authorization: Bearer ${ICAV2_ACCESS_TOKEN}" | \
              jq --raw-output '.items[] | .name'
            fi
      - name: analysis-storage-id
        summary: |
          Optional, takes precedence over analysis-storage-size
        type: string
        completion:
          command_string: |-
            if [[ -n "${ICAV2_ACCESS_TOKEN-}" ]]; then
              curl --silent --fail --location --request "GET" \
                   --url "https://${ICAV2_BASE_URL-ica.illumina.com}/ica/rest/api/analysisStorages" \
                   --header 'Accept: application/vnd.illumina.v3+json' \
                   --header "Authorization: Bearer ${ICAV2_ACCESS_TOKEN}" | \
              jq --raw-output '.items[] | .id'
            fi
      - name: analysis-storage-size
        summary: |
          Optional, default is set to Small
        type: string
        completion:
          command_string: |-
            if [[ -n "${ICAV2_ACCESS_TOKEN-}" ]]; then
              curl --silent --fail --location --request "GET" \
                   --url "https://${ICAV2_BASE_URL-ica.illumina.com}/ica/rest/api/analysisStorages" \
                   --header 'Accept: application/vnd.illumina.v3+json' \
                   --header "Authorization: Bearer ${ICAV2_ACCESS_TOKEN}" | \
              jq --raw-output '.items[] | .name'
            fi
  icav2-launch-pipeline-analysis:
    summary: |
      Launch a pipeline analysis in ICAv2
    options:
      - name: launch-json
        summary: |
          Required, launch json similar to v1
        type: string
        completion:
          command_string: |-
            find "${CURRENT_WORD-.}"* -maxdepth 0 -type d & (
              if [[ -d "${CURRENT_WORD-.}" ]]; then 
                find "${CURRENT_WORD-.}" -maxdepth 1 -type f -name '*.json'; 
              elif [[ -n "${CURRENT_WORD-}" && -d "$(dirname "${CURRENT_WORD}")" ]]; then
                find "$(dirname "${CURRENT_WORD}")" -maxdepth 1 -type f -name '*.json'
              else
                find "." -maxdepth 1 -type f -name '*.json'
              fi
            ) & wait
      - name: pipeline-id
        summary: |
          Optional, id of the pipeline you wish to launch
        type: string
        completion:
          command_string: |-
            if [[ -n "${ICAV2_ACCESS_TOKEN-}" ]]; then
              curl --silent --fail --location --request "GET" \
                   --url "https://${ICAV2_BASE_URL-ica.illumina.com}/ica/rest/api/pipelines" \
                   --header 'Accept: application/vnd.illumina.v3+json' \
                   --header "Authorization: Bearer ${ICAV2_ACCESS_TOKEN}" | \
              jq --raw-output '.items[] | .id'
            fi
      - name: pipeline-code
        summary: |
          Optional, code of the pipeline you wish to launch
        type: string
        completion:
          command_string: |-
            if [[ -n "${ICAV2_ACCESS_TOKEN-}" ]]; then
              curl --silent --fail --location --request "GET" \
                   --url "https://${ICAV2_BASE_URL-ica.illumina.com}/ica/rest/api/pipelines" \
                   --header 'Accept: application/vnd.illumina.v3+json' \
                   --header "Authorization: Bearer ${ICAV2_ACCESS_TOKEN}" | \
              jq --raw-output '.items[] | .code'
            fi
      - name: project-id
        summary: |
          Optional, provide the project id, takes precedence over project-name
        type: string
        completion:
          command_string: |-
            if [[ -n "${ICAV2_ACCESS_TOKEN-}" ]]; then
              curl --silent --fail --location --request "GET" \
                   --url "https://${ICAV2_BASE_URL-ica.illumina.com}/ica/rest/api/projects" \
                   --header 'Accept: application/vnd.illumina.v3+json' \
                   --header "Authorization: Bearer ${ICAV2_ACCESS_TOKEN}" | \
              jq --raw-output '.items[] | .id'
            fi
      - name: project-name
        summary: |
          Optional, provide the project name
        type: string
        completion:
          command_string: |-
            if [[ -n "${ICAV2_ACCESS_TOKEN-}" ]]; then
              curl --silent --fail --location --request "GET" \
                   --url "https://${ICAV2_BASE_URL-ica.illumina.com}/ica/rest/api/projects" \
                   --header 'Accept: application/vnd.illumina.v3+json' \
                   --header "Authorization: Bearer ${ICAV2_ACCESS_TOKEN}" | \
              jq --raw-output '.items[] | .name'
            fi
      - name: output-parent-folder-id
        summary: |
          Optional, the id of the parent folder to write outputs to
        type: string
      - name: output-parent-folder-path
        summary: |
          Optional, the path to the parent folder to write outputs to (will be created if it doesn't exist)
        type: string
        completion:
          command_string: |-
              if [[ -n "${ICAV2_ACCESS_TOKEN-}" ]]; then
                  project_index="-1";
                  project_name="";
                  project_id="";
                  if [[ "$(basename "${SHELL}")" == "bash" ]]; then
                      for i in "${!words[@]}"; do
                         if [[ "${words[$i]}" == "--project-name" ]]; then
                             project_index="$(expr $i + 1)";
                             project_name="${words[$project_index]}";
                         elif [[ "${words[$i]}" == "--project-id" ]]; then
                             project_index="$(expr $i + 1)";
                             project_id="${words[$project_index]}";
                         fi;
                      done;
                  elif [[ "$(basename "${SHELL}")" == "zsh" ]]; then
                      for ((i = 1; i <= $#words; i++)); do
                         if [[ "${words[$i]}" == "--project-name" ]]; then
                             project_index="$(expr $i + 1)";
                             project_name="${words[$project_index]}";
                         elif [[ "${words[$i]}" == "--project-id" ]]; then
                             project_index="$(expr $i + 1)";
                             project_id="${words[$project_index]}";
                         fi;
                      done;
                  fi;
                if [[ -n "${project_name}" || -n "${project_id}" ]]; then
                  if [[ -z "${project_id}" ]]; then 
                    project_id="$(curl --silent --fail --location \
                                    --request "GET" \
                                    --url "https://${ICAV2_BASE_URL-ica.illumina.com}/ica/rest/api/projects" \
                                    --header "Accept: application/vnd.illumina.v3+json" \
                                    --header "Authorization: Bearer ${ICAV2_ACCESS_TOKEN}" | \
                                  jq --raw-output \
                                    --arg "project_name" "${project_name}" \
                                    '.items[] | select(.name==$project_name) | .id')";
                  fi;
                  if [[ "${CURRENT_WORD}" == */ ]]; then
                    parent_folder="${CURRENT_WORD}";
                  else
                    parent_folder="$(dirname "${CURRENT_WORD}")";
                  fi;
                  curl --silent --fail --location \
                    --request "GET" \
                    --header "Accept: application/vnd.illumina.v3+json" \
                    --header "Authorization: Bearer ${ICAV2_ACCESS_TOKEN}" \
                    --url "https://${ICAV2_BASE_URL-ica.illumina.com}/ica/rest/api/projects/${project_id}/data?parentFolderPath=${parent_folder%/}/&filenameMatchMode=EXACT&type=FOLDER" | 
                  jq --raw-output \
                    '.items[] | .data.details.path';
                fi
              fi
      - name: analysis-storage-id
        summary: |
          Optional, takes precedence over analysis-storage-size
        type: string
        completion:
          command_string: |-
            if [[ -n "${ICAV2_ACCESS_TOKEN-}" ]]; then
              curl --silent --fail --location --request "GET" \
                   --url "https://${ICAV2_BASE_URL-ica.illumina.com}/ica/rest/api/analysisStorages" \
                   --header 'Accept: application/vnd.illumina.v3+json' \
                   --header "Authorization: Bearer ${ICAV2_ACCESS_TOKEN}" | \
              jq --raw-output '.items[] | .id'
            fi
      - name: analysis-storage-size
        summary: |
          Optional, default is set to Small
        type: string
        completion:
          command_string: |-
            if [[ -n "${ICAV2_ACCESS_TOKEN-}" ]]; then
              curl --silent --fail --location --request "GET" \
                   --url "https://${ICAV2_BASE_URL-ica.illumina.com}/ica/rest/api/analysisStorages" \
                   --header 'Accept: application/vnd.illumina.v3+json' \
                   --header "Authorization: Bearer ${ICAV2_ACCESS_TOKEN}" | \
              jq --raw-output '.items[] | .name'
            fi
      - name: activation-id
        summary: |
          Optional, the activation id used by the pipeline analysis
        type: string
      - name: create-cwl-analysis-json-output-path
        summary: |
          Path to output a json file that contains the body for a create cwl analysis
        type: string
  icav2-list-analysis-steps:
    summary: |
      List steps of an analysis
    options:
      - name: project-id
        summary: |
          Optional, provide the project id, takes precedence over project-name
        type: string
        completion:
          command_string: |-
            if [[ -n "${ICAV2_ACCESS_TOKEN-}" ]]; then
              curl --silent --fail --location --request "GET" \
                   --url "https://${ICAV2_BASE_URL-ica.illumina.com}/ica/rest/api/projects" \
                   --header 'Accept: application/vnd.illumina.v3+json' \
                   --header "Authorization: Bearer ${ICAV2_ACCESS_TOKEN}" | \
              jq --raw-output '.items[] | .id'
            fi
      - name: project-name
        summary: |
          Optional, provide the project name
        type: string
        completion:
          command_string: |-
            if [[ -n "${ICAV2_ACCESS_TOKEN-}" ]]; then
              curl --silent --fail --location --request "GET" \
                   --url "https://${ICAV2_BASE_URL-ica.illumina.com}/ica/rest/api/projects" \
                   --header 'Accept: application/vnd.illumina.v3+json' \
                   --header "Authorization: Bearer ${ICAV2_ACCESS_TOKEN}" | \
              jq --raw-output '.items[] | .name'
            fi
      - name: analysis-id
        summary: |
          Required, the analysis id you wish to list logs of
        type: string
      - name: show-technical-steps
        summary: |
          Also list technical steps
  icav2-get-analysis-step-logs:
    summary: |
      Launch a pipeline analysis in ICAv2
    options:
      - name: project-id
        summary: |
          Optional, provide the project id, takes precedence over project-name
        type: string
        completion:
          command_string: |-
            if [[ -n "${ICAV2_ACCESS_TOKEN-}" ]]; then
              curl --silent --fail --location --request "GET" \
                   --url "https://${ICAV2_BASE_URL-ica.illumina.com}/ica/rest/api/projects" \
